<div class="town-crier-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Городской глашатай</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="tc_include_context">
                <input id="tc_include_context" type="checkbox" />
                <span>Учитывать последние сообщения чата при генерации (для колорита)</span>
            </label>

            <label for="tc_context_messages">
                <span>Сколько последних сообщений учитывать</span>
            </label>
            <input id="tc_context_messages" class="text_pole" type="number" min="1" max="50" step="1" />

            <label class="checkbox_label" for="tc_include_lorebook">
                <input id="tc_include_lorebook" type="checkbox" />
                <span>Учитывать лорбук (мировую информацию) при генерации</span>
            </label>

            <label for="tc_max_tokens">
                <span>Максимум токенов на один ответ модели</span>
            </label>
            <input id="tc_max_tokens" class="text_pole" type="number" min="50" max="32000" step="50" />

            <label class="checkbox_label" for="tc_include_all_default">
                <input id="tc_include_all_default" type="checkbox" />
                <span>Учитывать все записи глашатая по умолчанию (влияет на записи текущего чата)</span>
            </label>

            <label for="tc_custom_instructions">
                <span>Доп. указания для генерации (сеттинг, тон, стиль и т.п.)</span>
            </label>
            <textarea id="tc_custom_instructions" class="text_pole" rows="3" placeholder="Например: мир тёмного фэнтези, мрачный ироничный тон..."></textarea>
        </div>
    </div>
</div>
