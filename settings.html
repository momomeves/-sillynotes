<div class="town-crier-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Городской глашатай</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="tc_include_context">
                <input id="tc_include_context" type="checkbox" />
                <span>Учитывать последние сообщения чата при генерации (для колорита)</span>
            </label>
            <label for="tc_custom_instructions">
                <span>Доп. указания для генерации (сеттинг, тон, стиль и т.п.)</span>
            </label>
            <textarea id="tc_custom_instructions" class="text_pole" rows="3" placeholder="Например: мир тёмного фэнтези, мрачный ироничный тон..."></textarea>
        </div>
    </div>
</div>
